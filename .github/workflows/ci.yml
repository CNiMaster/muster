name: CI

# 公开仓库 Actions 免费（不限分钟）；这两条只省时间不省钱：
# - paths-ignore：纯文档/计划类改动不触发（不影响构建产物与测试）
# - concurrency：同分支连续推送自动取消旧 run，只跑最新一次
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-unit:
    name: Typecheck & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & Integration Tests
        run: npx vitest run --exclude 'tests/e2e/**'

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [check-and-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Build Assets
        run: npm run build
      - name: Run E2E Tests
        run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check-and-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
