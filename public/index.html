<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0e14">
<link rel="manifest" href="manifest.json">
<title>Muster</title>
<style>
:root{--bg:#f5f0eb;--surface:#fffcf8;--s2:#f2eee9;--s3:#e8e3dd;--s4:#ddd8d1;--border:#e0dbd5;--border-light:#d2cdc6;--text:#1c1a18;--t2:#6b6660;--t3:#9c9690;--accent:#c97d4e;--green:#5a9e7a;--yellow:#c9a03e;--red:#c95a4a;--purple:#8f7ab0;--cyan:#4a9ea8;--orange:#c97d4e;--accent10:#c97d4e1a;--accent15:#c97d4e26;--accent20:#c97d4e33;--accent30:#c97d4e4d;--green10:#5a9e7a1a;--green20:#5a9e7a33;--green30:#5a9e7a4d;--red10:#c95a4a1a;--red20:#c95a4a33;--red30:#c95a4a4d;--purple10:#8f7ab01a;--purple15:#8f7ab026;--purple20:#8f7ab033;--purple30:#8f7ab04d;--yellow10:#c9a03e1a;--yellow20:#c9a03e33;--yellow30:#c9a03e4d;--yellow40:#c9a03e66;--cyan15:#4a9ea826;--cyan20:#4a9ea833;--cyan30:#4a9ea84d;--orange15:#c97d4e26;--orange20:#c97d4e33;--orange30:#c97d4e4d;--t310:#9c96901a;
	--blue:var(--accent);--blue20:var(--accent20);--blue25:var(--accent20);--blue30:var(--accent30);
	--radius:10px;--radius-sm:6px;--radius-lg:14px;--shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);--glass:rgba(255,252,248,.72);--glass-border:rgba(0,0,0,.06);--transition:.2s cubic-bezier(.4,0,.2,1)}
body.dark-theme{--bg:#1a1816;--surface:#242220;--s2:#2e2c29;--s3:#3a3734;--s4:#46433f;--border:#3a3734;--border-light:#4a4743;--text:#e6e2dd;--t2:#99948e;--t3:#706b65;--glass:rgba(26,24,22,.72);--glass-border:rgba(255,255,255,.06);--shadow:0 2px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 32px rgba(0,0,0,.5)}
@media(prefers-color-scheme:dark){
  body.theme-auto{--bg:#1a1816;--surface:#242220;--s2:#2e2c29;--s3:#3a3734;--s4:#46433f;--border:#3a3734;--border-light:#4a4743;--text:#e6e2dd;--t2:#99948e;--t3:#706b65;--glass:rgba(26,24,22,.72);--glass-border:rgba(255,255,255,.06);--shadow:0 2px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 32px rgba(0,0,0,.5)}
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;font-size:13px;line-height:1.5;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--border-light)}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;font-weight:500;transition:all var(--transition);font-family:inherit}
button:active{transform:scale(.97)}
input,textarea{background:var(--s2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 12px;font-size:13px;font-family:inherit;outline:none;resize:none;transition:border-color var(--transition)}
input:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:var(--t3)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

.app{display:grid;grid-template-columns:272px 1fr;grid-template-rows:52px 1fr;height:100vh}


/* === Topbar === */
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);z-index:10}
.topbar h1{font-size:15px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.topbar h1>span:first-of-type{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-r{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--t2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-on{background:var(--green);box-shadow:0 0 6px var(--green30)}.dot-off{background:var(--t3)}

/* === Left Sidebar === */
.left{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.left-sec{padding:12px 14px;border-bottom:1px solid var(--border)}
.left-sec-title{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t3);letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.left-sec-title button{font-size:10px;padding:3px 10px;background:var(--s3);color:var(--t2);border-radius:var(--radius-sm);font-weight:600}
.left-sec-title button:hover{color:var(--text);background:var(--accent30)}
.left-body{flex:1;overflow-y:auto;padding:6px 10px}

.ws-item{padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:1px;font-size:13px;transition:all var(--transition)}
.ws-item:hover{background:var(--s2)}.ws-item.active{background:var(--s3);font-weight:500}
.ws-icon{font-size:14px}
.tree-toggle{cursor:pointer;user-select:none;font-size:10px;color:var(--t3);width:16px;flex-shrink:0;text-align:center;transition:var(--transition)}
.tree-group{margin-left:18px;border-left:1px solid var(--border);padding-left:6px}
.tree-group.collapsed{display:none}
.ws-item .tree-toggle:hover{color:var(--text)}

.task-item{display:flex;align-items:center;gap:4px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:1px;font-size:12px;transition:all var(--transition)}
.task-item:hover{background:var(--s2)}.task-item.active{background:var(--s3)}
.task-item:hover .task-actions{display:inline-flex!important}
.task-status{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;flex-shrink:0}
.ts-chatting{background:var(--cyan)}.ts-planning{background:var(--yellow)}.ts-executing{background:var(--accent);animation:pulse 1.5s infinite}.ts-completed{background:var(--green)}.ts-failed{background:var(--red)}.ts-stopped{background:var(--t3)}

.bl-item{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 12px;font-size:11px;color:var(--t2);cursor:default;border-radius:var(--radius-sm);transition:background var(--transition)}
.bl-item:hover{background:var(--s2)}

/* Agent list */
.agent-item{padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:1px;font-size:12px;display:flex;align-items:center;gap:6px;transition:background var(--transition)}
.agent-item:hover{background:var(--s2)}.agent-item.active{background:var(--s3)}
.agent-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.av-human{background:var(--purple20);color:var(--purple)}.av-leader{background:var(--cyan20);color:var(--cyan)}
.av-worker{background:var(--accent20);color:var(--accent)}.av-verifier{background:var(--orange20);color:var(--orange)}
.agent-dot{width:6px;height:6px;border-radius:50%;margin-left:auto;flex-shrink:0}
.ad-idle{background:var(--t3)}.ad-running{background:var(--green);animation:pulse 1.5s infinite}.ad-done{background:var(--green)}

/* === Right Panel === */
.right{display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:0;background:var(--bg)}.right::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 65% at 50% -15%,rgba(91,154,255,.12),transparent),radial-gradient(ellipse 70% 55% at 85% 85%,rgba(168,130,248,.08),transparent)}

.chat-header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);display:flex;align-items:center;justify-content:space-between;min-height:48px}
.chat-title{font-weight:600;font-size:14px;letter-spacing:-.1px}
.chat-meta{font-size:11px;color:var(--t2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chat-messages{flex:1;overflow-y:auto;padding:18px}
.chat-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--t3);text-align:center}

/* Messages */
.msg{margin-bottom:14px;display:flex;gap:10px;max-width:820px;animation:fadeIn .25s ease-out}
.msg-human{border-left:3px solid var(--purple);padding-left:10px}
.msg-leader{border-left:3px solid var(--cyan);padding-left:10px}
.msg-worker{border-left:3px solid var(--accent);padding-left:10px}
.msg-verifier{border-left:3px solid var(--orange);padding-left:10px}
.msg-system{border-left:3px solid var(--t3);padding-left:10px}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.msg-name{font-weight:600;font-size:12px}
.msg-time{font-size:10px;color:var(--t3)}
.msg-text{font-size:13px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word}
.msg-text a{color:var(--accent)}

.msg-human .msg-avatar{background:var(--purple15);color:var(--purple)}
.msg-human .msg-name{color:var(--purple)}
.msg-leader .msg-avatar{background:var(--cyan15);color:var(--cyan)}
.msg-leader .msg-name{color:var(--cyan)}
.msg-worker .msg-avatar{background:var(--accent15);color:var(--accent)}
.msg-worker .msg-name{color:var(--accent)}
.msg-verifier .msg-avatar{background:var(--orange15);color:var(--orange)}
.msg-verifier .msg-name{color:var(--orange)}
.msg-system .msg-avatar{background:var(--t310);color:var(--t3)}
.msg-system .msg-name{color:var(--t3)}
.msg-system .msg-text{font-size:12px;font-style:italic;color:var(--t2)}
.msg-expert{border-left:3px solid var(--accent);padding-left:10px}
.msg-expert .msg-avatar{font-size:16px}

.badge-pass{color:var(--green);font-weight:700}.badge-fail{color:var(--red);font-weight:700}

/* Mode toggle */
.mode-sel{display:flex;gap:2px;margin-left:6px;background:var(--s2);border-radius:var(--radius-sm);padding:2px}
.md-btn{padding:3px 12px;border-radius:5px;font-size:11px;font-weight:600;background:transparent;color:var(--t2);transition:all var(--transition)}
.md-btn:hover{color:var(--text);background:var(--s3)}
.md-btn.active{background:var(--green20);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* Expert panel */
.expert-panel{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0}
.expert-chip{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:600;letter-spacing:-.1px}
.expert-chip .e-dot{width:5px;height:5px;border-radius:50%;animation:pulse 1.5s infinite}

/* Complexity selector */
.complexity-sel{display:flex;gap:2px;margin-left:6px;background:var(--s2);border-radius:var(--radius-sm);padding:2px}
.cx-btn{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;background:transparent;color:var(--t2);transition:all var(--transition)}
.cx-btn:hover{color:var(--text);background:var(--s3)}
.cx-btn.active{background:var(--accent20);color:var(--accent)}

/* Agent Detail */
.agent-detail{padding:18px;overflow-y:auto;flex:1}
.ad-section{margin-bottom:18px}
.ad-section h3{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;margin-bottom:8px;letter-spacing:.6px}
.ad-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.ad-row span:first-child{color:var(--t2)}.ad-row span:last-child{font-weight:500}
.tool-item{padding:8px 12px;background:var(--s2);border-radius:var(--radius-sm);margin-bottom:4px;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px}
.tool-icon{font-size:11px}
.ad-output{background:var(--s2);border-radius:var(--radius);padding:12px;font-size:12px;color:var(--t2);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;line-height:1.6}

/* Input area */
.chat-input{padding:12px 18px;border-top:1px solid var(--border);background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{flex:1;min-height:38px;max-height:120px;padding:9px 14px;border-radius:var(--radius);background:var(--s2);border:1px solid var(--border);transition:border-color var(--transition)}
.chat-input textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent15)}
.btn-send{background:linear-gradient(135deg,var(--accent),#4a7af0);color:#fff;padding:9px 20px;font-weight:600;border-radius:var(--radius);letter-spacing:-.1px;box-shadow:0 2px 8px rgba(91,154,255,.25)}
.btn-send:hover{filter:brightness(1.1);box-shadow:0 4px 12px rgba(91,154,255,.35)}
.btn-send:disabled{opacity:.35;filter:none;box-shadow:none}

#agentActivity{display:none;padding:8px 18px;font-size:11px;color:var(--t3);background:var(--surface);border-left:3px solid var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0}
#inputToolbar{display:flex;gap:6px;padding:6px 18px 10px;border-top:1px solid var(--border);background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);align-items:center;flex-wrap:wrap}

/* Topbar buttons - Settings/Goal */
.topbar-btn{background:transparent;color:var(--t2);font-size:16px;padding:4px 6px;border-radius:var(--radius-sm)}
.topbar-btn:hover{background:var(--s3);color:var(--text)}

/* === Mobile === */
.menu-btn{display:none;background:transparent;color:var(--text);font-size:18px;padding:4px 8px}
/* 遮罩层默认隐藏，不占用 Grid 位置 */
.left-overlay{display:none!important}

@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .left{position:fixed;left:0;top:52px;bottom:0;width:280px;z-index:100;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-lg)}
  .left.open{transform:translateX(0)}
  .left-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
  .left-overlay.show{display:block}
  .menu-btn{display:inline-block}
  .topbar-r .complexity-sel,.topbar-r span[id="agentN"],.topbar-r span[id="costN"],.topbar-r span[id="tokenN"]{display:none}
  .chat-header{padding:10px 14px}
  .chat-messages{padding:12px}
  .chat-input{padding:10px 14px}
  #inputToolbar{padding:6px 14px 8px}
}

@media(max-width:480px){
  .chat-input textarea{font-size:16px}
  .btn-send{padding:9px 14px}
  .msg{gap:8px}
  .msg-avatar{width:28px;height:28px;font-size:11px}
}

/* === PWA support === */
@media(display-mode:standalone){
  .topbar{-webkit-app-region:drag;padding-left:78px}
  .topbar h1,.topbar-r,.topbar button,.topbar .mode-sel,.topbar .complexity-sel{-webkit-app-region:no-drag}
  .traffic-lights{display:flex!important}
}
.traffic-lights{display:none;gap:8px;align-items:center;margin-right:6px;flex-shrink:0}
.tl-dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.tl-close{background:#ff5f57}.tl-min{background:#febc2e}.tl-max{background:#28c840}

/* Welcome card animation */
.welcome-step{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t2);padding:6px 0}
.welcome-step .step-num{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:11px;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="traffic-lights"><div class="tl-dot tl-close"></div><div class="tl-dot tl-min"></div><div class="tl-dot tl-max"></div></div>
    <h1><button class="menu-btn" onclick="toggleSidebar()">☰</button> <span>Muster</span><span id="statusBadge" style="font-size:11px;font-weight:500;color:var(--t2);margin-left:8px"></span><span id="statusDot" class="dot dot-off"></span></h1>
    <div class="topbar-r">
      <span>Agents: <strong id="agentN">0</strong></span>
      <span style="color:var(--border)">|</span>
      <span id="costN">$0.000</span>
      <span style="color:var(--border)">|</span>
      <span id="tokenN">0 tokens</span>
      <span style="color:var(--border)">|</span>
      <div class="mode-sel">
        <button class="md-btn active" id="modeAgent" onclick="switchMode('agent')">🤖 Agent</button>
        <button class="md-btn" id="modeChat" onclick="switchMode('groupchat')">💬 群聊</button>
      </div>
      <span style="color:var(--border)">|</span>
      <div class="complexity-sel">
        <button class="cx-btn" onclick="setCx('simple')">简单</button>
        <button class="cx-btn active" onclick="setCx('normal')">标准</button>
        <button class="cx-btn" onclick="setCx('deep')">深度</button>
      </div>
      <span style="color:var(--border)">|</span>
      <button class="topbar-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙</button>
<button class="topbar-btn" onclick="openSettings()" title="设置">⚙</button>
      <button class="topbar-btn" onclick="toggleGoalMenu()" style="color:var(--yellow)" title="设定目标">🎯</button>
      <span class="dot dot-off" id="wsDot"></span><span id="wsL">连接中</span>
    </div>
  </div>

  <div class="left-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="left" id="sidebar">
    <div class="left-sec">
      <div class="left-sec-title">工作区 <button onclick="openWorkspace()">打开目录</button><button onclick="newTask()" style="margin-left:4px;background:var(--blue30);color:var(--blue);font-size:14px;line-height:1;padding:0 6px" title="新建任务">+</button></div>
      <div id="wsList"></div>
    </div>
    <div class="left-body" id="treeBody" style="overflow-y:auto;flex:1;padding:4px 0">
      <div style="padding:20px;text-align:center;color:var(--t3);font-size:12px;line-height:1.8">
        选择工作区后<br>自动展开任务树<br><br>
        👆 点击工作区直接对话 → 自动新建任务<br>
        👆 点击具体任务 → 进入该任务<br>
        👆 点击任务名旁 ▸ 展开子任务/清单
      </div>
    </div>
  </div>

  <div class="right" id="rightPanel">
    <div class="chat-header">
      <div class="chat-title" id="chatTitle">Muster</div>
      <div class="chat-meta" id="chatMeta">
        <span id="modelBadge" style="background:var(--purple10);color:var(--purple);padding:3px 10px;border-radius:var(--radius-sm);font-size:11px;cursor:pointer;font-weight:600;letter-spacing:-.1px" onclick="cycleModel()" title="点击切换Leader模型">Leader: Opus</span>
      </div>
    </div>
    <div class="chat-messages" id="chatMsgs">
      <div class="chat-empty">
        <div style="text-align:center">
          <div style="font-size:48px;margin-bottom:20px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(91,154,255,.3))">🤖</div>
          <div style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.3px">欢迎来到 Muster</div>
          <div style="font-size:13px;color:var(--t2);margin-bottom:24px;font-weight:500">AI 多智能体协作平台</div>
          <div style="display:flex;flex-direction:column;gap:10px;text-align:left;max-width:300px;margin:0 auto">
            <div class="welcome-step"><span class="step-num" style="background:var(--accent20);color:var(--accent)">1</span> 左侧选择工作区</div>
            <div class="welcome-step"><span class="step-num" style="background:var(--cyan20);color:var(--cyan)">2</span> 直接输入消息和 Leader 对话</div>
            <div class="welcome-step"><span class="step-num" style="background:var(--purple20);color:var(--purple)">3</span> 展开树看团队进度</div>
            <div class="welcome-step"><span class="step-num" style="background:var(--yellow20);color:var(--yellow)">4</span> Leader 自动分配专家和技能</div>
          </div>
        </div>
      </div>
    </div>
    <div id="agentActivity" style="display:none;padding:6px 16px;font-size:11px;color:var(--t3);background:var(--surface);border-left:3px solid var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0"></div>
    <div class="chat-input">
      <textarea id="inputBox" placeholder="输入消息和 Leader 对话..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendMsg()}"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMsg()">发送</button>
    </div>
    <div id="inputToolbar" style="display:flex;gap:6px;padding:6px 16px 10px;border-top:1px solid var(--border);background:var(--surface);align-items:center;flex-wrap:wrap">
      <!-- Timer Toggle -->
      <button id="timerToggle" onclick="toggleTimer()" class="topbar-btn" style="font-size:12px;padding:4px 8px;border-radius:var(--radius-sm);font-weight:500;border:1px solid var(--border)">⏰ 定时</button>
      <div id="timerControls" style="display:none;gap:4px;align-items:center;font-size:12px;color:var(--t2)">
        <span>延迟</span>
        <input id="timerDelay" type="number" value="30" min="1" style="width:50px;font-size:11px;padding:2px 4px">
        <span>分钟后触发</span>
      </div>
      <span style="color:var(--t3);font-size:11px">|</span>
      <!-- Goal -->
      <button id="goalToggle" onclick="toggleGoalMenu()" class="topbar-btn" style="background:var(--yellow10);color:var(--yellow);font-size:12px;padding:4px 8px;border-radius:var(--radius-sm);font-weight:500;border:1px solid var(--yellow40)">🎯 Goal</button>
      <div id="goalPresets" style="display:none;gap:4px;align-items:center;flex-wrap:wrap">
        <button onclick="setGoalPreset('所有测试通过')" style="background:var(--s3);color:var(--t2);padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer">✅ 所有测试通过</button>
        <button onclick="setGoalPreset('无安全漏洞')" style="background:var(--s3);color:var(--t2);padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer">🛡️ 无安全漏洞</button>
        <button onclick="setGoalPreset('API 文档完整')" style="background:var(--s3);color:var(--t2);padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer">📖 API 文档完整</button>
        <button onclick="setGoalPreset('代码无遗留问题')" style="background:var(--s3);color:var(--t2);padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer">🧹 代码无遗留问题</button>
        <input id="goalCustom" placeholder="自定义..." style="width:120px;font-size:11px;padding:2px 6px" onkeydown="if(event.key==='Enter')setGoalPreset(this.value)">
      </div>
    </div>
  </div>
</div>

<script>
let ws, workspaces=[], tasks={}, chatMsgs={}, backlog={}, activeWs=null, activeTask=null, activeAgent=null, viewMode='chat', complexity='normal', wsDelay=1001, expandedTree={}, leaderModel='opus', pendingMsg=null, timerMode=false, goalActive=false, lastSentMsg=null, _agentStart=null, _agentTimer=null, taskMode='agent';

function toggleSidebar(){const s=gid('sidebar');const o=gid('sidebarOverlay');s.classList.toggle('open');if(o)o.classList.toggle('show',s.classList.contains('open'))}
function closeSidebar(){const s=gid('sidebar');const o=gid('sidebarOverlay');if(s)s.classList.remove('open');if(o)o.classList.remove('show')}

function gid(id){return document.getElementById(id)}
function esc(t){return t?t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function escJs(s){return s?s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r'):''}

// WebSocket
function connect(){
  // 从服务端恢复持久化配置
  fetch('/api/config').then(r=>r.json()).then(cfg=>{
    if(cfg.complexity)complexity=cfg.complexity;
    if(cfg.leaderModel)leaderModel=cfg.leaderModel;
    gid('modelBadge').textContent='Leader: '+leaderModel.charAt(0).toUpperCase()+leaderModel.slice(1);
    renderCx();
  });
  ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`);
  ws.onopen=()=>{gid('wsDot').className='dot dot-on';gid('wsL').textContent='已连接';wsDelay=1000};
  ws.onclose=()=>{gid('wsDot').className='dot dot-off';gid('wsL').textContent='重连中';wsDelay=Math.min(wsDelay*2,30000);setTimeout(connect,wsDelay)};
  ws.onmessage=(e)=>handleMsg(JSON.parse(e.data));
}

function handleMsg(m){
  switch(m.type){
    case 'init': workspaces=m.workspaces||[];break;
    case 'workspace:created': workspaces.push(m.data);selectWs(m.data.id);break;
    case 'task:created': tasks[m.data.id]=m.data;render();
      if(pendingMsg){activeTask=m.data.id;render();sendMsg(pendingMsg);pendingMsg=null}
      else{selectTask(m.data.id)}break;
    case 'task:update': tasks[m.data.id]=m.data;goalActive=!!m.data.goal;break;
    case 'subtask:update': if(tasks[m.data.taskId]){const st=tasks[m.data.taskId].subtasks?.find(s=>s.id===m.data.id);if(st)Object.assign(st,m.data)}break;
    case 'chat:message':
      if(!chatMsgs[m.data.taskId])chatMsgs[m.data.taskId]=[];
      chatMsgs[m.data.taskId].push(m.data);
      // Hide activity indicator when real message arrives
      const act=gid('agentActivity');if(act)act.style.display='none';_agentStart=null;if(_agentTimer){clearInterval(_agentTimer);_agentTimer=null}
      // 恢复输入状态
      gid('sendBtn').disabled=false;gid('inputBox').disabled=false;gid('sendBtn').textContent='发送';
      if(m.data.taskId===activeTask)renderChat();
      break;
    case 'agent:output':
      if(m.data?.sessionId===activeTask){
        const el=gid('agentActivity');
        const prefix=m.data.subtaskId?'[W] ':m.data.role==='leader'?'[L] ':'';
        if(el){
          if(!_agentStart){_agentStart=Date.now();startAgentTimer()}
          el.innerHTML=`<span id="agentElapsed" style="color:var(--blue);font-weight:600"></span> ${prefix}${esc(m.data.text?.slice(0,100)||(m.data.role+' 思考中...'))}`;el.style.display='block'
        }
      }
      break;
    case 'agent:tool':
      if(m.data?.sessionId===activeTask){
        const el=gid('agentActivity');
        const prefix=m.data.subtaskId?'[W] ':m.data.role==='leader'?'[L] ':'';
        if(el){
          if(!_agentStart){_agentStart=Date.now();startAgentTimer()}
          el.innerHTML=`<span id="agentElapsed" style="color:var(--blue);font-weight:600"></span> ${prefix}🔧 <span style="color:var(--blue)">${esc(m.data.tool)}</span> ${esc(JSON.stringify(m.data.input||{}).slice(0,80))}${m.data.toolCallCount?` <span style="color:var(--t3)">#${m.data.toolCallCount}</span>`:''}`;el.style.display='block'
        }
      }
      break;
    case 'config:updated': complexity=m.complexity;if(m.leaderModel){leaderModel=m.leaderModel;gid('modelBadge').textContent='Leader: '+leaderModel.charAt(0).toUpperCase()+leaderModel.slice(1)}renderCx();break;
    case 'mode:switched': if(tasks[m.taskId]){tasks[m.taskId].mode=m.mode;taskMode=m.mode}renderMode();render();break;
    case 'timer:scheduled': if(activeTask){if(!chatMsgs[activeTask])chatMsgs[activeTask]=[];const ts=new Date().toISOString();chatMsgs[activeTask].push({role:'system',agentName:'系统',text:'⏰ 定时消息已安排 ('+(m.data.delayMs/60000)+'分钟后触发)',timestamp:ts})}render();break;
    case 'restore:done': workspaces=m.workspaces||[];render();break;
    case 'backlog:update': backlog[m.data.workspaceId]=m.data.items;render();break;
    case 'task:deleted': delete tasks[m.data.id];delete chatMsgs[m.data.id];if(activeTask===m.data.id){activeTask=null;viewMode='chat'}render();break;
    case 'error': alert(m.data?.error||m.error||'未知错误');break;
  }
  render();
}

function send(msg){ws.send(JSON.stringify(msg))}

// Actions
function openWorkspace(){
  // 打开目录浏览弹窗
  showDirPicker('~/');
}

function showDirPicker(startPath){
  const modal=document.createElement('div');
  modal.id='dirModal';
  modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center';
  modal.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:480px;box-shadow:var(--shadow-lg);max-height:70vh;display:flex;flex-direction:column">
    <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
      <span style="font-weight:600">打开目录</span>
      <input id="dirInput" value="${esc(startPath)}" style="flex:1;font-size:12px;padding:4px 8px" onkeydown="if(event.key==='Enter')browseDir(this.value)">
      <button onclick="browseDir(gid('dirInput').value)" style="background:var(--s3);color:var(--text);font-size:12px;padding:4px 10px">浏览</button>
    </div>
    <div id="dirList" style="flex:1;overflow-y:auto;padding:8px;max-height:300px;min-height:150px"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end">
      <button onclick="gid('dirModal').remove()" style="background:var(--s3);color:var(--t2)">取消</button>
      <button onclick="confirmOpenDir()" style="background:var(--blue);color:#fff;font-weight:600">打开</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  browseDir(startPath);
}

async function browseDir(path){
  const r=await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
  const d=await r.json();
  gid('dirInput').value=d.path;
  const list=gid('dirList');
  if(!d.exists){list.innerHTML=`<div style="padding:20px;text-align:center;color:var(--red)">目录不存在: ${esc(d.path)}</div>`;return}
  // 返回上级
  const parent=d.path.split('/').slice(0,-1).join('/')||'/';
  let html=`<div class="ws-item" ondblclick="browseDir('${escJs(parent)}')" style="color:var(--t2)"><span>📁</span> ..</div>`;
  d.dirs.forEach(dir=>{
    html+=`<div class="ws-item" ondblclick="browseDir('${escJs(dir.path)}')" onclick="gid('dirInput').value='${escJs(dir.path)}'"><span>📁</span> ${esc(dir.name)}</div>`;
  });
  if(!d.dirs.length)html+=`<div style="padding:12px;color:var(--t3);text-align:center;font-size:12px">空目录（双击选这个）</div>`;
  list.innerHTML=html;
}

async function confirmOpenDir(){
  const path=gid('dirInput').value.trim();
  if(!path)return;
  send({type:'workspace:create',name:path.split('/').pop(),path});
  gid('dirModal').remove();
}
function newTask(){
  if(!activeWs){alert('请先选择或新建工作区');return}
  const ws2=workspaces.find(w=>w.id===activeWs);
  send({type:'task:create',workspaceId:activeWs,cwd:ws2?.path||''});
}
async function renameTask(id){
  const name=prompt('新任务名称:');
  if(!name)return;
  await fetch(`/api/task/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  render();
}
function archiveTask(id){
  if(!confirm('确定归档此任务？'))return;
  fetch(`/api/task/${id}/archive`,{method:'POST'});
  delete tasks[id];delete chatMsgs[id];
  if(activeTask===id){activeTask=null;viewMode='chat'}
  render();
}
function deleteTask(id){
  if(!confirm('确定永久删除此任务？此操作不可恢复。'))return;
  fetch(`/api/task/${id}`,{method:'DELETE'});
  delete tasks[id];delete chatMsgs[id];
  if(activeTask===id){activeTask=null;viewMode='chat'}
  render();
}
function stopTask(id){
  if(!confirm('确定停止此任务？正在运行的 agent 将被终止。'))return;
  fetch(`/api/task/${id}/stop`,{method:'POST'}).then(r=>r.json()).then(d=>{
    if(d.ok)console.log('stopped',d.killed,'agents');
  });
}
function selectWs(id){
  activeWs=id;
  // 收起之前展开的任务树
  expandedTree={};
  activeTask=null;
  activeAgent=null;
  if(!backlog[id]){fetch(`/api/backlog/${id}`).then(r=>r.json()).then(items=>{backlog[id]=items;render()})}
  // 自动展开此工作区
  expandedTree['ws-'+id]=true;
  render()}
function selectTask(id){
  activeTask=id;activeAgent=null;viewMode='chat';expandedTree['task-'+id]=true;
  // Restore per-task leader model
  if(tasks[id]?.leaderModel){leaderModel=tasks[id].leaderModel}
  renderMode();render();scrollChat()
}
function selectView(mode,agentId){viewMode=agentId?'agent':mode;activeAgent=agentId||null;render()}
function sendMsg(text){
  if(!text)text=gid('inputBox').value.trim();
  if(!text)return;
  lastSentMsg=text;
  gid('inputBox').value='';
  // 有工作区无任务 → 自动建新任务，建好后再发
  if(!activeTask && activeWs){
    const ws2=workspaces.find(w=>w.id===activeWs);
    if(ws2){pendingMsg=text;send({type:'task:create',workspaceId:activeWs,cwd:ws2.path||''});return}
  }
  if(!activeTask){alert('请先选择或新建工作区');return}
  // 定时模式：发到 scheduler
  if(timerMode){
    const delay=parseInt(gid('timerDelay').value)||30;
    send({type:'timer:schedule',taskId:activeTask,text,delayMinutes:delay});
    gid('timerToggle').click(); // 关闭定时模式
    return;
  }
  send({type:'chat:send',taskId:activeTask,text});
  // 禁用输入直到收到回复
  gid('sendBtn').disabled=true;gid('inputBox').disabled=true;gid('sendBtn').textContent='等待中...';
}
function retryLastMsg(){if(lastSentMsg&&activeTask){sendMsg(lastSentMsg)}}
function setCx(c){complexity=c;send({type:'config:set',complexity:c});renderCx()}
function renderCx(){document.querySelectorAll('.cx-btn').forEach(b=>{b.classList.toggle('active',b.textContent===({simple:'简单',normal:'标准',deep:'深度'}[complexity]))})}

// ===== Mode Switch =====
function switchMode(mode){
  if(!activeTask){return}
  const t=tasks[activeTask];
  if(t?.mode===mode)return;
  send({type:'mode:switch',taskId:activeTask,mode});
}
function renderMode(){
  const t=activeTask&&tasks[activeTask];
  taskMode=t?.mode||'agent';
  const agentBtn=gid('modeAgent');
  const chatBtn=gid('modeChat');
  if(agentBtn){agentBtn.classList.toggle('active',taskMode==='agent')}
  if(chatBtn){chatBtn.classList.toggle('active',taskMode==='groupchat')}
  // 群聊模式修改 placeholder
  const input=gid('inputBox');
  if(input){input.placeholder=taskMode==='groupchat'?'输入消息，与专家们群聊...':'输入消息和 Leader 对话...'}
}

// Model
// ===== Timer =====
function toggleTimer(){
  timerMode=!timerMode;
  gid('timerToggle').style.background=timerMode?'var(--blue25)':'transparent';
  gid('timerToggle').style.color=timerMode?'var(--blue)':'var(--t3)';
  gid('timerToggle').style.borderColor=timerMode?'var(--blue)':'var(--border)';
  gid('timerControls').style.display=timerMode?'flex':'none';
}
// ===== Goal =====
function toggleGoalMenu(){
  const el=gid('goalPresets');
  el.style.display=el.style.display==='none'?'flex':'none';
}
function setGoalPreset(goalText){
  if(!activeTask)return;
  goalActive=!goalActive;
  if(!goalActive){
    send({type:'goal:set',taskId:activeTask,goal:null});
    gid('goalToggle').style.background='var(--yellow15)';
    gid('goalToggle').style.borderColor='var(--yellow40)';
    gid('goalToggle').textContent='🎯 Goal';
    gid('goalPresets').style.display='none';
    render();
    return;
  }
  send({type:'goal:set',taskId:activeTask,goal:goalText});
  const maxIter={simple:3,normal:5,deep:10}[complexity];
  gid('goalToggle').textContent=`🎯 ${goalText}`;
  gid('goalToggle').style.background='var(--yellow30)';
  gid('goalToggle').style.borderColor='var(--yellow)';
  gid('goalPresets').style.display='none';
  render();
}
// ===== Model =====
const MODELS=['opus','sonnet','haiku'];
function cycleModel(){
  const idx=MODELS.indexOf(leaderModel);
  leaderModel=MODELS[(idx+1)%MODELS.length];
  gid('modelBadge').textContent='Leader: '+leaderModel.charAt(0).toUpperCase()+leaderModel.slice(1);
  // Update active task's leader model independently
  if(activeTask&&tasks[activeTask]){
    tasks[activeTask].leaderModel=leaderModel;
    send({type:'config:set',leaderModel});
  }
}

// Render — 树形结构
function render(){
  renderWorkspaces();
  renderTree();
  renderChat();
  updateTopbar();
  renderMode();
}

function renderWorkspaces(){
  gid('wsList').innerHTML=workspaces.map(w=>{
    const isExpanded=!!expandedTree['ws-'+w.id];
    return `<div class="ws-item ${w.id===activeWs?'active':''}" onclick="selectWs('${w.id}')">
      <span class="tree-toggle" onclick="event.stopPropagation();toggleTree('ws-${w.id}')">${isExpanded?'▾':'▸'}</span>
      <span class="ws-icon">📁</span>${esc(w.name)}
    </div>`;
  }).join('')||'<div style="padding:8px;color:var(--t3);font-size:12px">点击"打开目录"新建工作区</div>';
}

function toggleTree(key){
  expandedTree[key]=!expandedTree[key];
  render();
}

function renderTree(){
  if(!activeWs){gid('treeBody').innerHTML='';return}
  const ts=Object.values(tasks).filter(t=>t.workspaceId===activeWs).reverse();
  const wsKey='ws-'+activeWs;
  if(!expandedTree[wsKey]){gid('treeBody').innerHTML='';return}

  let html='<div class="tree-group" style="margin-left:0;border-left:none;padding-left:0">';
  ts.forEach(t=>{
    const tk='task-'+t.id;
    const isExp=!!expandedTree[tk];
    const isActive=t.id===activeTask;
    const backlogItems=backlog[activeWs]||[];
    const firstMsg=(t.conversationHistory?.[0]?.content||'新任务').slice(0,28);
    html+=`<div class="task-item ${isActive?'active':''}" onclick="selectTask('${t.id}')">
      <span class="tree-toggle" onclick="event.stopPropagation();toggleTree('${tk}')">${isExp?'▾':'▸'}</span>
      <span class="task-status ts-${t.status}"></span>
      ${t.goal?'<span style="font-size:10px">🎯</span>':''}
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(firstMsg)}</span>
      <span style="font-size:10px;color:var(--t3);flex-shrink:0">$${(t.totalCost||0).toFixed(3)}</span>
      <span class="task-actions" style="display:none;gap:4px;flex-shrink:0">
        ${t.status==='executing'||t.status==='planning'?`<span onclick="event.stopPropagation();stopTask('${t.id}')" style="cursor:pointer;color:var(--yellow);font-size:14px" title="停止">⏹️</span>`:''}
        <span onclick="event.stopPropagation();renameTask('${t.id}')" style="cursor:pointer;color:var(--t3);font-size:14px" title="重命名">✏️</span>
        <span onclick="event.stopPropagation();archiveTask('${t.id}')" style="cursor:pointer;color:var(--t3);font-size:14px" title="归档">📦</span>
        <span onclick="event.stopPropagation();deleteTask('${t.id}')" style="cursor:pointer;color:var(--red);font-size:14px" title="删除">🗑️</span>
      </span>
    </div>`;
    // Active task: always show team + checklist; other tasks: only when expanded
    if(isActive || isExp){
      html+='<div class="tree-group">';
      // Agent 团队
      html+=`<div style="font-size:10px;color:var(--t3);padding:4px 8px 2px;text-transform:uppercase;letter-spacing:.3px">👥 团队</div>`;
      html+=`<div onclick="selectTask('${t.id}')" class="bl-item ${isActive?'active':''}" style="cursor:pointer"><span class="agent-avatar av-leader" style="width:16px;height:16px;font-size:7px">L</span>Leader</div>`;
      (t.subtasks||[]).forEach((st,i)=>{
        const s=st.status;
        const wModel=st.workerModel?`<span style="font-size:9px;color:var(--purple);margin-left:4px">${st.workerModel}</span>`:'';
        const wPersona=st.persona?`<span style="font-size:9px;color:var(--blue);margin-left:2px">${st.persona}</span>`:'';
        const wSkill=st.skill?`<span style="font-size:9px;color:var(--yellow);margin-left:2px">${st.skill}</span>`:'';
        html+=`<div onclick="selectView('agent','worker-${i}')" class="bl-item" style="cursor:pointer"><span class="agent-avatar av-worker" style="width:16px;height:16px;font-size:7px">W</span>Worker#${i+1}${wModel}${wPersona}${wSkill} <span style="font-size:9px;color:var(--t3)">${s}</span></div>`;
        if(st.attempts?.some(a=>a.role==='verifier')){
          html+=`<div onclick="selectView('agent','verifier-${i}')" class="bl-item" style="cursor:pointer;padding-left:24px"><span class="agent-avatar av-verifier" style="width:14px;height:14px;font-size:6px">V</span>Verifier#${i+1}</div>`;
        }
      });
      // 清单（始终显示，带新增按钮）
      html+=`<div style="font-size:10px;color:var(--t3);padding:6px 8px 2px;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between">📋 清单 <button onclick="addBacklogItem()" style="background:transparent;color:var(--t3);font-size:10px;padding:0 4px">+</button></div>`;
      if(backlogItems.length){
        backlogItems.forEach(i=>{
          const icon=i.status==='completed'?'✅':i.status==='in_progress'||i.status==='assigned'?'🔄':'⬜';
          html+=`<div class="bl-item">${icon} ${esc(i.title)} <button onclick="event.stopPropagation();removeBacklog('${i.id}')" style="margin-left:auto;background:transparent;color:var(--t3);font-size:9px;padding:0 4px">✕</button></div>`;
        });
      } else {
        html+=`<div style="padding:2px 8px 4px;font-size:11px;color:var(--t3)">暂无清单项</div>`;
      }
      html+='</div>';
    }
  });
  html+='</div>';
  if(!ts.length)html='<div style="padding:12px;color:var(--t3);font-size:12px;text-align:center">无任务<br><br>点击工作区自动创建</div>';
  gid('treeBody').innerHTML=html;
}

function renderAgents(){
  const el=gid('agentList');
  if(!el)return;

function renderChat(){
  if(activeAgent){renderAgentDetail();return}
  if(!activeTask||!tasks[activeTask]){
    gid('chatMsgs').innerHTML='<div class="chat-empty"><div><div style="font-size:24px;margin-bottom:12px">👋</div><div style="font-size:15px;color:var(--t2);margin-bottom:6px">欢迎来到 Muster</div><div style="font-size:12px;color:var(--t3);line-height:1.8">1. 左侧选择工作区，直接输入对话自动创建任务<br>2. Leader 自动规划、分配专家、执行验证<br>3. 顶部 <span style="color:var(--purple)">Leader</span> 可切换模型</div></div></div>';
    gid('chatMeta').innerHTML=`<span id="modelBadge" style="background:var(--purple10);color:var(--purple);padding:3px 10px;border-radius:var(--radius-sm);font-size:11px;cursor:pointer;font-weight:600;letter-spacing:-.1px" onclick="cycleModel()" title="点击切换Leader模型">Leader: ${leaderModel.charAt(0).toUpperCase()+leaderModel.slice(1)}</span>`;
    gid('chatTitle').textContent='Muster';
    return;
  }
  const msgs=chatMsgs[activeTask]||[];
  const t=tasks[activeTask];
  const maxGoalIter=t.goal?({simple:3,normal:5,deep:10}[complexity]||5):0;
  gid('chatTitle').textContent=esc((t.conversationHistory?.[0]?.content||'新任务').slice(0,32));
  const modeLabel=t.mode==='groupchat'?'<span style="background:var(--green20);color:var(--green);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">💬 群聊</span> ':'';
  const expertPanel=(t.mode==='groupchat'&&t.experts?.length)?'<div class="expert-panel">'+t.experts.map(e=>'<div class="expert-chip" style="background:'+e.color+'20;color:'+e.color+'">'+e.emoji+' '+esc(e.displayName)+' <div class="e-dot" style="background:'+e.color+'"></div></div>').join('')+'</div>':'';
  gid('chatMeta').innerHTML=modeLabel+expertPanel+`<span id="modelBadge" style="background:var(--purple10);color:var(--purple);padding:3px 10px;border-radius:var(--radius-sm);font-size:11px;cursor:pointer;font-weight:600;letter-spacing:-.1px" onclick="cycleModel()" title="点击切换Leader模型">Leader: ${leaderModel.charAt(0).toUpperCase()+leaderModel.slice(1)}</span> ${t.goal?`<span style="background:var(--yellow20);color:var(--yellow);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">🎯 ${esc(t.goal).slice(0,20)} ${t.goalIterations||0}/${maxGoalIter}</span>`:''} <span class="task-status ts-${t?.status}"></span> ${statusL(t?.status)} | $${(t?.totalCost||0).toFixed(3)} ${tokenTableHtml(t)}`;

  if(!msgs.length){
    gid('chatMsgs').innerHTML='<div class="chat-empty"><div style="font-size:13px;color:var(--t2)">和 Leader 开始对话吧</div></div>';
    return;
  }

  gid('chatMsgs').innerHTML=msgs.map((m,mi)=>{
    const cls=`msg-${m.role}`;
    const avatar=getAvatar(m.role,m.agentName);
    const time=new Date(m.timestamp).toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'});
    let text=esc(m.text);
    text=text.replace(/APPROVED/g,'<span class="badge-pass">APPROVED ✓</span>');
    text=text.replace(/REJECTED/g,'<span class="badge-fail">REJECTED ✗</span>');
    // Error messages
    const isError=m.type==='error';
    const retryBtn=isError?`<button onclick="retryLastMsg()" style="margin-top:6px;background:var(--red);color:#fff;border:none;padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer">重试</button>`:'';
    // Collapsible long text (300+ chars)
    const COLLAPSE_LEN=300;
    const isLong=m.text&&m.text.length>COLLAPSE_LEN;
    let collapseHtml='';
    if(isLong){
      const short=esc(m.text.slice(0,COLLAPSE_LEN))+'...';
      const full=text;
      collapseHtml=`<span class="msg-collapsed" id="mc${mi}">${short} <span onclick="gid('mc${mi}').style.display='none';gid('mf${mi}').style.display='block'" style="color:var(--blue);cursor:pointer;font-size:11px">展开全部 (${m.text.length}字)</span></span><span class="msg-full" id="mf${mi}" style="display:none">${full} <span onclick="gid('mf${mi}').style.display='none';gid('mc${mi}').style.display='inline'" style="color:var(--blue);cursor:pointer;font-size:11px">收起</span></span>`;
    }
    const displayText=isLong?collapseHtml:isError&&m.text.length>80?esc(m.text.slice(0,80)+'...'):text;
    const detailToggle=isError&&m.text.length>80?`<span onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="color:var(--blue);cursor:pointer;font-size:11px;margin-left:6px">详情</span><div style="display:none;margin-top:4px;padding:6px;background:var(--s2);border-radius:4px;font-size:11px;white-space:pre-wrap;max-height:200px;overflow-y:auto">${text}</div>`:'';
    const expertStyle=m.role==='expert'?`border-left:3px solid ${getExpertColor(m.agentName)};${getExpertNameStyle(m.agentName)}`:'';
    return `<div class="msg ${cls}" style="${isError?'border-left:3px solid var(--red)':expertStyle}"><div class="msg-avatar">${avatar}</div><div class="msg-body"><div class="msg-head"><span class="msg-name" ${m.role==='expert'?`style="color:${getExpertColor(m.agentName)}"`:''}>${esc(m.agentName||m.role)}</span><span class="msg-time">${time}</span></div><div class="msg-text">${displayText}${detailToggle}${retryBtn}</div></div></div>`;
  }).join('');
}

function renderAgentDetail(){
  if(!activeTask||!activeAgent)return;
  const t=tasks[activeTask];
  const [role,idx]=activeAgent.split('-');
  const i=parseInt(idx);
  const st=(t?.subtasks||[])[i];
  if(!st){gid('chatMsgs').innerHTML='<div class="chat-empty">Agent 暂无数据</div>';return}

  const isWorker=role==='worker';
  const name=isWorker?`Worker#${i+1}`:`Verifier#${i+1}`;
  const avatar=getAvatar(isWorker?'worker':'verifier');
  const status=st.status;

  let html=`<div class="agent-detail">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <div class="msg-avatar" style="width:48px;height:48px;font-size:18px">${avatar}</div>
      <div><div style="font-weight:600;font-size:16px;color:var(--${isWorker?'blue':'orange'})">${name}</div>
      <div style="font-size:12px;color:var(--t2)">${esc(st.title)}</div></div>
    </div>
    <div class="ad-section"><h3>状态</h3>
      <div class="ad-row"><span>任务</span><span>${esc(st.title)}</span></div>
      <div class="ad-row"><span>状态</span><span>${statusL(status)}</span></div>
      <div class="ad-row"><span>尝试次数</span><span>${st.attempts?.length||0}</span></div>
      <div class="ad-row"><span>总耗时</span><span>${(function(){const wa=(st.attempts||[]).filter(a=>a.role==='worker'&&a.startedAt);if(!wa.length)return'-';const first=new Date(wa[0].startedAt);const last=wa[wa.length-1];const end=last.completedAt?new Date(last.completedAt):new Date();const sec=Math.round((end-first)/1000);const m=Math.floor(sec/60);const s=sec%60;return m>0?m+'分'+s+'秒':s+'秒'})()}</span></div>
      ${isWorker?`<div class="ad-row"><span>模型</span><span>${st.workerModel||'sonnet'}${st.attempts?.length>1?' → opus (升级)':''}</span></div>
      <div class="ad-row"><span>角色</span><span>${st.persona||'-'}</span></div>
      <div class="ad-row"><span>技能</span><span>${st.skill||'-'}</span></div>`:''}
    </div>`;

  const attempts=(st.attempts||[]).filter(a=>isWorker?a.role==='worker':a.role==='verifier');
  if(attempts.length){
    html+=`<div class="ad-section"><h3>工作记录</h3>`;
    attempts.forEach((a,ai)=>{
      const costStr=`$${(a.cost||0).toFixed(3)}`;
      const statusTag=a.status==='approved'?'<span class="badge-pass">APPROVED</span>':
                       a.status==='rejected'?'<span class="badge-fail">REJECTED</span>':
                       a.status==='failed'?'<span class="badge-fail">FAILED</span>':a.status;
      const tools=a.tools||[];
      const hasOutput=a.output&&a.output.length>0;
      // 计算耗时
      let durationStr='';
      if(a.startedAt){
        const start=new Date(a.startedAt);
        const end=a.completedAt?new Date(a.completedAt):new Date();
        const sec=Math.round((end-start)/1000);
        const min=Math.floor(sec/60);
        const s=sec%60;
        durationStr=min>0?`${min}分${s}秒`:`${s}秒`;
      }
      // 重试类型标识
      let retryLabel='';
      if(a.role==='worker'&&ai>0){
        retryLabel=ai===1?'<span style="color:var(--orange);font-size:10px;margin-left:6px">🔄 自我反思</span>':
                   ai===2?'<span style="color:var(--red);font-size:10px;margin-left:6px">🔄 Leader指导</span>':
                   `<span style="color:var(--red);font-size:10px;margin-left:6px">🔄 重试#${ai}</span>`;
      }
      html+=`<div style="margin-bottom:10px;padding:8px 10px;background:var(--s2);border-radius:6px;border-left:3px solid ${a.status==='approved'?'var(--green)':a.status==='rejected'||a.status==='failed'?'var(--red)':'var(--border)'}">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:600;font-size:12px">Attempt ${ai+1}${retryLabel}</span><span>${statusTag}${durationStr?` | ⏱${durationStr}`:''} | ${costStr}</span></div>
        ${a.errorCategory?`<div style="font-size:10px;color:var(--red);margin-bottom:4px">错误类型: ${esc(a.errorCategory)}</div>`:''}
        ${a.verifierFeedback?`<div style="font-size:10px;color:var(--orange);margin-bottom:4px;padding:4px 6px;background:var(--s2);border-radius:3px">Verifier: ${esc(a.verifierFeedback.slice(0,200))}</div>`:''}
        ${tools.length?`<div style="margin-bottom:6px"><div style="font-size:10px;color:var(--t3);margin-bottom:2px">工具调用 (${tools.length})</div>${tools.map(t=>`<div style="font-size:11px;padding:2px 0;color:var(--t2)"><span style="color:var(--blue)">🔧 ${esc(t.tool)}</span> <span style="font-size:10px">${esc(JSON.stringify(t.input||{}).slice(0,80))}</span></div>`).slice(-10).join('')}${tools.length>10?`<div style="font-size:10px;color:var(--t3)">... 共 ${tools.length} 次</div>`:''}</div>`:''}
        ${hasOutput?`<div style="font-size:10px;color:var(--t3);margin-bottom:2px;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">输出 (${a.output.length}字) ▾</div><div style="display:none;max-height:300px;overflow-y:auto;white-space:pre-wrap;font-size:11px;background:var(--s2);padding:6px;border-radius:4px">${esc(a.output)}</div>`:''}
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`<button style="background:var(--s3);color:var(--t2);width:100%;margin-top:8px" onclick="selectView('chat')">← 返回群聊</button></div>`;
  gid('chatMsgs').innerHTML=html;
}

function startAgentTimer(){
  if(_agentTimer)clearInterval(_agentTimer);
  _agentTimer=setInterval(()=>{
    const el=document.getElementById('agentElapsed');
    if(!el||!_agentStart){clearInterval(_agentTimer);_agentTimer=null;return}
    const sec=Math.round((Date.now()-_agentStart)/1000);
    const m=Math.floor(sec/60);const s=sec%60;
    el.textContent=(m>0?m+'m':'')+s+'s';
  },1000);
}

function getAvatar(role,name){
  if(role==='human')return'<div style="background:var(--purple25);color:var(--purple);width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700">你</div>';
  if(role==='leader')return'🤖';
  if(role==='worker')return'🔧';
  if(role==='verifier')return'🔍';
  if(role==='expert'){
    const t=activeTask&&tasks[activeTask];
    const expert=t?.experts?.find(e=>e.displayName===name);
    const emoji=expert?.emoji||'💡';
    return emoji;
  }
  return'📡';
}

function statusL(s){return{chatting:'对话中',planning:'规划中',executing:'执行中',completed:'已完成',failed:'失败',stopped:'已停止',pending:'等待',running:'执行中',verifying:'验证中',retrying:'重试中'}[s]||s||''}
function getExpertColor(name){
  const t=activeTask&&tasks[activeTask];
  const e=t?.experts?.find(x=>x.displayName===name);
  return e?.color||'var(--blue)';
}
function getExpertNameStyle(name){return ''}

function updateTopbar(){
  const t=activeTask&&tasks[activeTask];
  gid('agentN').textContent=t?((t.subtasks||[]).length*2+1):0;
  gid('costN').textContent=`$${(t?.totalCost||0).toFixed(3)}`;
  const st=t?statusL(t.status):'';
  gid('statusBadge').textContent=st?` · ${st}`:'';
  gid('statusDot').className=t?`dot ts-${t.status}`:'dot dot-off';
  // Token 统计：按模型显示
  const mu=t?.modelUsage||{};
  const models=Object.keys(mu);
  if(models.length){
    const total=models.reduce((s,m)=>s+(mu[m].inputTokens||0)+(mu[m].outputTokens||0),0);
    gid('tokenN').textContent=`${(total/1000).toFixed(1)}k tokens (${models.length} 模型)`;
  } else {
    gid('tokenN').textContent='0 tokens';
  }
}

// 渲染 token 详情（在群聊 meta 中显示）
function tokenTableHtml(t){
  const mu=t?.modelUsage||{};
  const models=Object.keys(mu);
  if(!models.length)return'';
  let html='<table style="font-size:11px;border-collapse:collapse;margin-top:4px"><tr style="color:var(--t3)"><th style="text-align:left;padding:2px 8px">模型</th><th style="padding:2px 8px">输入</th><th style="padding:2px 8px">输出</th><th style="padding:2px 8px">缓存</th><th style="padding:2px 8px">费用</th></tr>';
  models.forEach(m=>{
    const d=mu[m];
    const shortName=m.split('/').pop();
    html+=`<tr><td style="padding:2px 8px;color:var(--text)">${esc(shortName)}</td><td style="padding:2px 8px;text-align:right">${fmtTok(d.inputTokens)}</td><td style="padding:2px 8px;text-align:right">${fmtTok(d.outputTokens)}</td><td style="padding:2px 8px;text-align:right">${fmtTok(d.cacheReadTokens)}</td><td style="padding:2px 8px;text-align:right;color:var(--yellow)">$${(d.costUSD||0).toFixed(3)}</td></tr>`;
  });
  html+='</table>';
  return html;
}
function fmtTok(n){return n>=1000000?((n/1000000).toFixed(1)+'M'):n>=1000?((n/1000).toFixed(1)+'k'):String(n||0)}

function addBacklogItem(){
  if(!activeWs){alert('请先选择工作区');return}
  const title=prompt('任务标题');
  if(!title)return;
  send({type:'backlog:add',workspaceId:activeWs,title,description:''})
}
function renderBacklog(){
  const el=gid('backlogList');
  if(!el)return;
  if(!activeWs){el.innerHTML='<div style="padding:8px;color:var(--t3);font-size:12px">选择工作区后显示清单</div>';return}
  const items=backlog[activeWs]||[];
  const pending=items.filter(i=>i.status==='pending');
  const active=items.filter(i=>i.status==='in_progress'||i.status==='assigned');
  const done=items.filter(i=>i.status==='completed');
  if(!items.length){el.innerHTML='<div style="padding:8px;color:var(--t3);font-size:12px">点击 + 添加任务</div>';return}
  let html='';
  active.forEach(i=>{html+=`<div class="task-item" style="opacity:1"><span class="task-status ts-executing"></span>${esc(i.title)} <span style="color:var(--blue);font-size:10px">[${i.assignee||'...'}]</span></div>`});
  pending.forEach((i,idx)=>{html+=`<div class="task-item" onclick="moveBacklog('${i.id}','up',${idx})"><span class="task-status ts-chatting"></span>${esc(i.title)} <button onclick="event.stopPropagation();removeBacklog('${i.id}')" style="float:right;background:transparent;color:var(--t3);font-size:10px;padding:0 4px">✕</button></div>`});
  done.forEach(i=>{html+=`<div class="task-item" style="opacity:.5"><span class="task-status ts-completed"></span><s>${esc(i.title)}</s></div>`});
  el.innerHTML=html;
}
function removeBacklog(itemId){if(!activeWs)return;send({type:'backlog:remove',workspaceId:activeWs,itemId})}
function moveBacklog(itemId,dir,idx){
  const items=(backlog[activeWs]||[]).filter(i=>i.status==='pending');
  if(dir==='up'&&idx>0){[items[idx-1],items[idx]]=[items[idx],items[idx-1]]}
  else if(dir==='down'&&idx<items.length-1){[items[idx],items[idx+1]]=[items[idx+1],items[idx]]}
  const allItems=backlog[activeWs]||[];
  const newOrder=[...allItems.filter(i=>i.status!=='pending'),...items];
  send({type:'backlog:reorder',workspaceId:activeWs,itemIds:newOrder.map(i=>i.id)});
}

          Leader 是调度中枢，负责理解需求、规划任务、分配专家、汇总结果。模型越强理解越准。<br>
          点击顶部 <strong style="color:var(--purple)">Leader: XXX</strong> 标签切换，Worker 和 Verifier 由系统自动分配。
        </div>
        <div style="font-size:11px;color:var(--t3);line-height:1.6">
          • Opus — 最强模型，适合复杂需求<br>
          • Sonnet — 平衡速度与质量（默认）<br>
          • Haiku — 最快最省，适合简单任务
        </div>
      </div>

      <div style="background:var(--s2);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="color:var(--text);font-weight:600;font-size:14px">🎯 复杂度预设</span>
          <span style="color:var(--blue);font-weight:600;font-size:12px;background:var(--blue20);padding:3px 10px;border-radius:4px">当前: ${config.complexity==='simple'?'简单':config.complexity==='normal'?'标准':'深度'}</span>
        </div>
        <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:10px">
          控制 Worker 的重试次数和并行数量。复杂度越高越耐心但越贵。
        </div>
        <div style="display:flex;gap:8px">
          ${[{k:'simple',l:'简单',d:'出错重试1次<br>最多2个子任务并行<br>省钱省时间'},{k:'normal',l:'标准',d:'出错重试2次<br>最多3个子任务并行<br>日常推荐'},{k:'deep',l:'深度',d:'出错重试3次<br>最多3个子任务并行<br>追求质量'}].map(p=>`<div onclick="setCx('${p.k}')" style="flex:1;padding:12px;border-radius:8px;cursor:pointer;text-align:center;background:${config.complexity===p.k?'var(--blue20)':'var(--s3)'};border:1px solid ${config.complexity===p.k?'var(--blue)':'transparent'}"><div style="font-weight:600;font-size:13px;color:${config.complexity===p.k?'var(--blue)':'var(--text)'}">${p.l}</div><div style="font-size:11px;color:var(--t2);margin-top:4px;line-height:1.5">${p.d}</div></div>`).join('')}
        </div>
      </div>

      <div style="background:var(--s2);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="color:var(--text);font-weight:600;font-size:14px">🎯 Goal 模式</span>
          <span style="color:var(--yellow);font-weight:600;font-size:12px;background:var(--yellow20);padding:3px 10px;border-radius:4px">自治循环</span>
        </div>
        <div style="font-size:12px;color:var(--t2);line-height:1.8">
          <strong>是什么：</strong>给任务设定一个完成条件，系统自动执行 → 检查 → 重试，直到条件满足或预算用尽。<br><br>
          <strong>怎么用：</strong>
          <ol style="margin:4px 0 0 18px;padding:0">
            <li>选择一个任务</li>
            <li>点击输入框上方的 🎯 按钮</li>
            <li>输入条件如 "所有测试通过" 或 "API 文档完整无遗漏"</li>
            <li>系统自动循环执行，直到达标</li>
          </ol><br>
          <strong>停止条件：</strong>
          <ul style="margin:0 0 0 18px;padding:0">
            <li>评估员确认目标已达成</li>
            <li>达到最大迭代次数（简单3次 / 标准5次 / 深度10次）</li>
            <li>预算超限</li>
          </ul>
        </div>
      </div>

      <div style="background:var(--s2);border-radius:10px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="color:var(--text);font-weight:600;font-size:14px">⏰ 定时任务</span>
        </div>
        <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:10px">
          当 Worker 遇到 API 限流时自动安排重试，也可以手动调度延迟执行的任务。
        </div>
        <div style="background:var(--s3);border-radius:8px;padding:12px;margin-bottom:10px" id="jobsList">
          ${scheduledHtml}
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
          <span style="color:var(--t2);font-size:12px;white-space:nowrap">⏲️ 延迟</span>
          <input id="schedDelay" type="number" value="120" min="1" style="width:60px;font-size:12px">
          <span style="color:var(--t2);font-size:12px">分钟</span>
          <input id="schedReason" placeholder="原因" style="flex:1;font-size:12px">
        </div>
      </div>

    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function cancelJob(jobId){
  await fetch(`/api/scheduler/cancel/${jobId}`,{method:'POST'});
  gid('settingsModal').remove();
  openSettings();
}

function relativeTime(iso){
  const diff=new Date(iso)-Date.now();
  if(diff<0)return'已到期';
  const m=Math.floor(diff/60000);
  if(m<60)return`${m}分钟后`;
  const h=Math.floor(m/60);
  return`${h}小时${m%60}分钟后`;
}

// ===== Theme =====
let themeMode = 'dark'; // 'dark' | 'light' | 'auto'
function toggleTheme(){
  const modes = ['dark','light','auto'];
  const labels = {'dark':'🌙','light':'☀️','auto':'🔄'};
  const idx = modes.indexOf(themeMode);
  themeMode = modes[(idx+1)%3];
  document.body.classList.remove('dark-theme','theme-auto');
  if(themeMode==='auto'){
    document.body.classList.add('theme-auto');
    gid('themeBtn').textContent='🔄';
  } else if(themeMode==='light'){
    gid('themeBtn').textContent='☀️';
  } else {
    document.body.classList.add('dark-theme');
    gid('themeBtn').textContent='🌙';
  }
  // persist
  localStorage.setItem('musterTheme', themeMode);
}
// restore saved theme
(function(){const t=localStorage.getItem('musterTheme');if(t){themeMode=t;const labels={'dark':'🌙','light':'☀️','auto':'🔄'};document.body.classList.remove('dark-theme','theme-auto');if(t==='auto')document.body.classList.add('theme-auto');else if(t==='light'){}else{document.body.classList.add('dark-theme')}gid('themeBtn').textContent=labels[t]||'🌙'}})();

// Init
connect();

// Textarea auto-expand
gid('inputBox').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
</script>
